[package]
name = "astro-compress-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lol_html = "3.0"
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
rayon = "1.10"
walkdir = "2.5"
anyhow = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
